<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">

<title>Layar 2 · Pembayaran UKT InfoKHS</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="select" data-file="item-terpilih.html">
<main class="app">
  <header class="bar">
    <p class="step">InfoKHS · Langkah 2 dari 5</p>
    <h1>Pembayaran UKT</h1>

  <section class="view">
    <p id="select-hint"></p>
    <ul class="items" id="items"></ul>

      <h2>Daftar item terpilih</h2>
      <ul class="rows" id="selected-list"></ul>
      <p class="muted" id="selected-empty">Belum ada item yang dipilih.</p>
    </section>
  </section>
  <footer class="foot">
    <div class="total"><span>Total</span><strong id="total">Rp 0</strong></div>
    <div class="actions">
      <button type="button" class="btn primary" id="btn-next" disabled>Lanjut ke Konfirmasi</button>
    </div>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
