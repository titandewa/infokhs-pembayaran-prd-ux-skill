<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilih Item · Pembayaran UKT InfoKHS</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="select" data-file="index.html">
<main class="app">
  <header class="bar">
    <p class="step">Langkah 1 dari 4</p>
    <h1>Pilih Item Pembayaran UKT</h1>
    <ol class="progress" aria-label="Tahapan pembayaran">
      <li class="current" aria-current="step">Pilih item</li>
      <li class="">Konfirmasi</li>
      <li class="">Bank</li>
      <li class="">Nomor VA</li>
    </ol>
  </header>
  <section class="view">
    <p>Pilih item yang ingin Anda bayar. Setiap item hanya bisa dipilih satu kali.</p>
    <ul class="items" id="items"></ul>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <section class="box" aria-label="Daftar item terpilih">
      <h2>Daftar item terpilih</h2>
      <ul class="rows" id="selected-list"></ul>
      <p class="muted" id="selected-empty">Belum ada item yang dipilih.</p>
    </section>
  </section>
  <footer class="foot">
    <div class="total"><span>Total</span><strong id="total">Rp 0</strong></div>
    <p class="hint" id="next-hint"></p>
    <div class="actions"><button type="button" class="btn primary" id="btn-next" disabled>Periksa Pilihan</button></div>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
